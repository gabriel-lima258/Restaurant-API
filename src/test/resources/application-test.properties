spring.application.name=food-api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/food_api_test?createDatabaseIfNotExists=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:9081}

# configurando o flyway para usar as migrations e os dados
spring.flyway.locations=classpath:/db/migration

# configurando o pool do banco de dados para 1 conexão
spring.datasource.hikari.maximum-pool-size=1
